<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>拾光 · Daynote</title>
  <link rel="icon" href="./assets/app-icon.png">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 2.4-2 .9L4 5.5 2 9l1.8 1.6v2.8L2 15l2 3.5 2.4-.8 2 .9L9 21h6l.6-2.4 2-.9 2.4.8 2-3.5-1.8-1.6v-2.8L22 9l-2-3.5-2.4.8-2-.9L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v5h16v-5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 3 4H6l3-4-1-7ZM12 14v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C7 2 2 7 5 15c3 8 14 5 15-12ZM5 19 16 8"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <button class="primary sidebar-add" data-action="new"><svg><use href="#i-plus"/></svg> 新建待办 <kbd>N</kbd></button>
      <nav id="view-nav" aria-label="任务视图"></nav>
      <div class="nav-divider" aria-hidden="true"></div>
      <nav id="category-nav" aria-label="任务分类"></nav>
      <div class="sidebar-bottom">
        <button class="settings-button" data-action="settings"><svg><use href="#i-settings"/></svg> 偏好设置</button>
      </div>
    </aside>

    <main>
      <span id="storage-status" class="sr-only" role="status">本地已保存</span>
      <section class="content">
        <div class="section-heading"><h1 id="view-heading">全部待办 <span id="view-count">0</span></h1><div class="heading-actions"><button class="text-button" data-action="export"><svg><use href="#i-download"/></svg>导出备份</button><button class="icon-button notification-button" data-action="notifications" aria-label="提醒中心"><svg><use href="#i-bell"/></svg><span id="notification-dot" hidden></span></button></div></div>
        <div class="toolbar"><div class="status-tabs" role="group" aria-label="完成状态"><button class="active" data-status="pending">待完成</button><button data-status="completed">已完成</button><button data-status="all">全部</button></div><div class="toolbar-right"><label class="search-field"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索待办…" aria-label="搜索待办"></label><select id="sort" aria-label="任务排序"><option value="due">按截止时间</option><option value="created">最近创建</option><option value="priority">优先级优先</option></select></div></div>
        <div id="task-grid" class="task-grid" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <dialog id="editor" class="drawer" aria-labelledby="editor-heading">
    <form id="task-form">
      <div class="dialog-header"><h2 id="editor-heading">新建待办</h2><button type="button" class="icon-button" data-close="editor" aria-label="关闭编辑面板"><svg><use href="#i-close"/></svg></button></div>
      <div class="editor-body">
        <label class="field-label" for="task-title">任务标题 <span>必填</span></label><input id="task-title" name="title" maxlength="120" placeholder="想做些什么？" required autocomplete="off">
        <label class="field-label" for="task-notes">详细内容</label><textarea id="task-notes" name="notes" rows="4" maxlength="5000" placeholder="写下细节、想法，或一个小小的行动步骤…"></textarea>
        <div class="two-fields"><div><label class="field-label" for="task-category">分类</label><select id="task-category" name="category"><option>工作</option><option>生活</option><option>学习</option></select></div><div><label class="field-label" for="task-priority">优先级</label><select id="task-priority" name="priority"><option value="normal">普通</option><option value="high">重要</option></select></div></div>
        <div class="editor-divider"></div>
        <label class="field-label" for="task-due"><svg><use href="#i-calendar"/></svg>截止日期与时间 <span>可选</span></label><input id="task-due" name="dueAt" type="datetime-local">
        <label class="field-label" for="reminder-mode"><svg><use href="#i-bell"/></svg>提醒方式</label><select id="reminder-mode"><option value="none">不提醒</option><option value="custom">自定义日期和时间</option><option value="0">截止时提醒</option><option value="5">截止前 5 分钟</option><option value="15">截止前 15 分钟</option><option value="30">截止前 30 分钟</option></select>
        <div id="custom-reminder-field" hidden><label class="field-label" for="task-reminder">提醒日期与时间</label><input id="task-reminder" name="remindAt" type="datetime-local"></div>
        <p id="reminder-hint" class="field-hint">提醒时间和截止时间可以独立设置。</p>
        <label class="checkbox-label"><input id="task-pinned" name="pinned" type="checkbox">置顶这张卡片</label>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </div>
      <div class="editor-footer"><button id="delete-task" type="button" class="danger-button" hidden><svg><use href="#i-trash"/></svg>删除</button><div><button type="button" class="secondary" data-close="editor">取消</button><button type="submit" class="primary" id="save-task">保存待办<svg><use href="#i-arrow"/></svg></button></div></div>
    </form>
  </dialog>

  <dialog id="notifications" class="modal" aria-labelledby="notifications-heading"><div class="dialog-header"><h2 id="notifications-heading">提醒中心</h2><button class="icon-button" data-close="notifications" aria-label="关闭提醒中心"><svg><use href="#i-close"/></svg></button></div><div id="notification-list" class="notification-list"></div><div class="modal-footer"><span>错过的提醒，会在下次运行时出现。</span><button class="text-button" data-action="read">全部已读</button></div></dialog>

  <dialog id="settings" class="modal" aria-labelledby="settings-heading">
    <div class="dialog-header"><h2 id="settings-heading">偏好设置</h2><button class="icon-button" data-close="settings" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button></div>
    <div class="settings-body">
      <fieldset class="theme-field"><legend>主题色</legend><div class="theme-options">
        <label class="theme-option" data-accent="sage"><input type="radio" name="accent" value="sage"><span class="theme-swatch"></span><span>绿色</span></label>
        <label class="theme-option" data-accent="cream"><input type="radio" name="accent" value="cream"><span class="theme-swatch"></span><span>奶油</span></label>
        <label class="theme-option" data-accent="lavender"><input type="radio" name="accent" value="lavender"><span class="theme-swatch"></span><span>紫色</span></label>
        <label class="theme-option" data-accent="peach"><input type="radio" name="accent" value="peach"><span class="theme-swatch"></span><span>桃色</span></label>
        <label class="theme-option" data-accent="sky"><input type="radio" name="accent" value="sky"><span class="theme-swatch"></span><span>蓝色</span></label>
      </div><p class="field-hint">所有卡片统一跟随主题色。</p></fieldset>
      <div class="setting-row"><strong>深色外观</strong><input id="theme-toggle" type="checkbox" class="switch" aria-label="深色外观"></div>
      <div class="setting-row"><div><strong>开机自启动</strong><p id="startup-hint">登录 Windows 后在托盘运行。</p></div><input id="startup-toggle" type="checkbox" class="switch" aria-label="开机自启动" aria-describedby="startup-hint" disabled></div>
      <div class="setting-row"><div><strong>提醒声音</strong><p>由系统通知播放声音。</p></div><input id="sound-toggle" type="checkbox" class="switch" aria-label="提醒声音"></div>
      <div class="setting-row"><div><strong>通知测试</strong><p id="notification-permission">检查系统是否可以展示提醒。</p></div><button class="secondary" data-action="test-notification">发送测试</button></div>
      <div class="settings-backup"><h3>备份与恢复</h3><div><button class="secondary" data-action="export"><svg><use href="#i-download"/></svg>导出备份</button><button class="secondary" data-action="import"><svg><use href="#i-upload"/></svg>导入备份</button></div></div>
      <div class="mode-note" id="settings-mode-note"></div>
    </div>
  </dialog>

  <dialog id="confirm-import" class="modal compact-modal" aria-labelledby="import-heading"><div class="dialog-header"><h2 id="import-heading">恢复这份备份？</h2></div><div class="settings-body"><p id="import-description"></p><p class="field-hint">恢复会替换当前任务、提醒记录和偏好设置。建议先导出当前数据。</p></div><div class="confirm-footer"><button class="secondary" data-close="confirm-import">取消</button><button class="primary" id="confirm-import-button">恢复备份</button></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" hidden></button><button class="toast-close" aria-label="关闭提示">×</button></div>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
